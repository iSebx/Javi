name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compilar
        run: gradle :app:assembleBaseDebug :app:assembleIconosDebug --no-daemon --stacktrace
      - name: Preparar APK
        run: |
          cp app/build/outputs/apk/base/debug/app-base-debug.apk Javi.apk
          cp app/build/outputs/apk/iconos/debug/app-iconos-debug.apk Javi-con-iconos.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Javi
          path: |
            Javi.apk
            Javi-con-iconos.apk
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima Javi.apk Javi-con-iconos.apk --title "Javi (última versión)" --notes "Compilación ${{ github.run_number }} · ${{ github.sha }}. Javi.apk es la versión normal. Javi-con-iconos.apk suma el permiso de accesibilidad y Play Protect suele bloquearla."
